{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="auth-container">
    <img src="{% static 'images/kafu_logo.png' %}" class="logo">

    <h2>KAFU DOCUMENT MANAGEMENT SYSTEM</h2>
    <h3>Login</h3>

    {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username or Email" required>

        <div class="password-wrapper">
            <input type="password" id="loginpass" name="password" placeholder="Password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('loginpass', this)">Show</button>
        </div>

        <button type="submit">Login</button>
    </form>

    <p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
    <p>Don't have an account? <a href="{% url 'register' %}">Register </a></p>
</div>

<script>
function togglePassword(fieldId, btn) {
    let field = document.getElementById(fieldId);

    if (field.type === "password") {
        field.type = "text";
        btn.textContent = "Hide";
    } else {
        field.type = "password";
        btn.textContent = "Show";
    }
}
</script>

</body>
</html>
