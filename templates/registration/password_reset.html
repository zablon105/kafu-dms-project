{% load static %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">

<div class="auth-container">
    <h2>Reset Password</h2>
    <p>Enter your email address:</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit">Send Reset Link</button>
    </form>

    <p><a href="/login/">Back to Login</a></p>
</div>
