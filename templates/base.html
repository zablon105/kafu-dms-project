{% load static %}
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">

<title>KAFU DMS</title>

<link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=12">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    /* Top Bar with Dark Mode Icon */
    .top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 10px 20px;
        margin-bottom: 20px;
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: var(--shadow);
    }
    
    .dark-mode-icon {
        background: transparent;
        border: none;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: var(--text-primary);
        font-size: 18px;
    }
    
    .dark-mode-icon:hover {
        background: var(--border);
        transform: rotate(15deg);
    }
    
    /* Role badge in sidebar */
    .role-badge-sidebar {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        background: rgba(255,255,255,0.15);
        color: white;
    }
    
    .role-badge-sidebar.admin { background: #dc2626; }
    .role-badge-sidebar.staff { background: #16a34a; }
    .role-badge-sidebar.student { background: #3b82f6; }
    
    /* Logo in sidebar */
    .sidebar-logo {
        text-align: center;
        margin-bottom: 25px;
        padding: 10px 0;
    }
    
    .sidebar-logo-img {
        width: 60px;
        height: 60px;
        object-fit: contain;
    }
    
    /* Hamburger Button - TOP LEFT CORNER */
    @media (max-width: 768px) {
        .hamburger-btn {
            display: flex !important;
            position: fixed !important;
            top: 15px !important;
            left: 15px !important;
            bottom: auto !important;
            right: auto !important;
            width: 45px !important;
            height: 45px !important;
            border-radius: 10px !important;
            background: #3b82f6 !important;
            border: none !important;
            color: white !important;
            font-size: 20px !important;
            cursor: pointer !important;
            z-index: 9999 !important;
            align-items: center !important;
            justify-content: center !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
        }
        
        .hamburger-btn:active {
            transform: scale(0.95);
        }
        
        .sidebar {
            position: fixed !important;
            left: -280px !important;
            top: 0 !important;
            width: 280px !important;
            height: 100% !important;
            z-index: 9998 !important;
            transition: left 0.3s ease !important;
        }
        
        .sidebar.active {
            left: 0 !important;
        }
        
        .main {
            margin-left: 0 !important;
            width: 100% !important;
            padding: 60px 15px 15px 15px !important;
        }
        
        .top-bar {
            margin-top: 0;
            margin-bottom: 15px;
        }
    }
    
    @media (min-width: 769px) {
        .hamburger-btn {
            display: none !important;
        }
    }
</style>

</head>

<body>

<div id="loader-screen">
    <div class="loader-box">
        <h2>KAFU DMS</h2>
        <p id="loadingText">Loading...</p>
        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>
    </div>
</div>

<div id="pageLoader">
   <div class="loader-bar"></div>
</div>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <!-- School Logo instead of Bell and Text -->
    <div class="sidebar-logo">
        <img src="{% static 'images/kafu_logo.png' %}" alt="KAFU Logo" class="sidebar-logo-img">
    </div>

    {% if is_admin %}
    <a href="{% url 'admin_dashboard' %}">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
        <span class="role-badge-sidebar admin">Admin</span>
    </a>
    {% elif is_staff %}
    <a href="{% url 'staff_dashboard' %}">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
        <span class="role-badge-sidebar staff">Staff</span>
    </a>
    {% elif is_student %}
    <a href="{% url 'student_dashboard' %}">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
        <span class="role-badge-sidebar student">Student</span>
    </a>
    {% endif %}

    <a href="{% url 'home' %}">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="{% url 'profile' %}">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

    <a href="{% url 'logout' %}">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
    </a>

</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainContent">

   <!-- TOP BAR - Professional Dark Mode Toggle -->
<div class="top-bar">
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" id="darkModeToggle">
        <i class="fa-solid fa-moon"></i>
    </button>
</div>

    {% block content %}
    <!-- Child templates will insert content here -->
    {% endblock %}
</div>

</div>

<!-- Hamburger Menu Button - TOP LEFT CORNER -->
<button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileSidebar()">
    <i class="fa-solid fa-bars"></i>
</button>

<form style="display:none;">
    {% csrf_token %}
</form>

<script src="{% static 'js/main.js' %}"></script>

<script>
    // Update dark mode icon based on current mode
    function updateDarkModeIcon() {
        var toggleBtn = document.getElementById('darkModeToggle');
        if (toggleBtn) {
            var isDark = document.body.classList.contains('dark-mode');
            var icon = toggleBtn.querySelector('i');
            if (icon) {
                if (isDark) {
                    icon.className = 'fa-solid fa-sun';
                } else {
                    icon.className = 'fa-solid fa-moon';
                }
            }
        }
    }
    
    // Enhanced toggleDarkMode that also updates icon
    var originalToggleDarkMode = window.toggleDarkMode;
    window.toggleDarkMode = function() {
        if (originalToggleDarkMode) {
            originalToggleDarkMode();
        } else {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
            } else {
                localStorage.setItem('darkMode', 'disabled');
            }
        }
        updateDarkModeIcon();
    };
    
    // Simple mobile sidebar toggle
    function toggleMobileSidebar() {
        var sidebar = document.getElementById('sidebar');
        if (sidebar) {
            sidebar.classList.toggle('active');
        }
    }
    
    // Close sidebar when clicking outside
    document.addEventListener('click', function(e) {
        var sidebar = document.getElementById('sidebar');
        var hamburger = document.getElementById('hamburgerBtn');
        
        if (window.innerWidth <= 768 && sidebar && sidebar.classList.contains('active')) {
            if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        }
    });
    
    // Fix loader
    window.addEventListener('load', function() {
        var loaderScreen = document.getElementById('loader-screen');
        if (loaderScreen) {
            setTimeout(function() {
                loaderScreen.style.display = 'none';
            }, 500);
        }
        updateDarkModeIcon();
    });
    
    // Initialize dark mode icon on page load
    document.addEventListener('DOMContentLoaded', function() {
        updateDarkModeIcon();
    });
</script>

</body>
</html>
